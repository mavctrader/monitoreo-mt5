<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Monitoreo MT5</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<section id="vista-login">
  <form id="form-login">
    <h1>Centro de Monitoreo MT5</h1>
    <input type="email" id="email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <p id="error-login" class="error"></p>
  </form>
</section>

<section id="vista-panel" hidden>
  <header>
    <h1>Centro de Monitoreo MT5</h1>
    <button id="btn-salir">Salir</button>
  </header>

  <details id="plantillas-seccion">
    <summary>Plantillas de reglas por prop firm</summary>
    <table class="tabla-plantillas">
      <thead><tr><th>Prop firm</th><th>Fase</th><th>Pérdida diaria</th><th>Drawdown</th><th>Objetivo</th><th>Días mín.</th><th>Reset</th><th></th></tr></thead>
      <tbody id="cuerpo-plantillas"></tbody>
    </table>
    <form id="form-plantilla">
      <input type="text" name="prop_firm" placeholder="Prop firm (ej. FundingPips)" required>
      <input type="text" name="fase" placeholder="Fase (ej. fase_1, fase_2, fondeada)" required>
      <input type="number" step="0.01" name="perdida_diaria_max_pct" placeholder="Pérdida diaria %">
      <input type="number" step="0.01" name="drawdown_max_pct" placeholder="Drawdown %">
      <input type="number" step="0.01" name="objetivo_fase_pct" placeholder="Objetivo %">
      <input type="number" name="min_dias_trading" placeholder="Días mín.">
      <input type="time" name="hora_reset">
      <input type="text" name="zona_horaria" placeholder="Zona horaria" value="UTC">
      <input type="url" name="fuente_url" placeholder="URL fuente (opcional)">
      <button type="submit">Guardar plantilla</button>
    </form>
  </details>

  <main id="lista-cuentas">
    <p class="aviso">Cargando cuentas...</p>
  </main>
</section>

<template id="plantilla-cuenta">
  <article class="cuenta">
    <header class="cuenta-header">
      <div>
        <span class="algo-trading" title="Algo Trading"></span>
        <span class="insignia insignia-rol"></span>
        <span class="cuenta-alias"></span>
      </div>
      <div class="cuenta-header-derecha">
        <span class="cuenta-login"></span>
        <span class="indicador señal-vida" title="Señal de vida"></span>
      </div>
    </header>
    <div class="cuenta-subtitulo">
      <span class="cuenta-broker"></span>
    </div>

    <p class="aviso-slave" hidden></p>

    <div class="cuenta-metricas">
      <div><label>Saldo</label><span class="m-saldo"></span></div>
      <div><label>Flotante</label><span class="m-flotante"></span></div>
    </div>

    <div class="cuenta-objetivos">
      <div class="fila-objetivo">
        <span class="etiqueta">Hoy</span>
        <span class="valor-hoy"></span>
      </div>
      <div class="fila-objetivo">
        <span class="etiqueta">Acumulado</span>
        <span class="valor-acumulado"></span>
      </div>

      <div class="barra-bloque">
        <div class="barra-header"><span class="etiqueta">Objetivo</span><span class="texto-objetivo"></span></div>
        <div class="barra-fondo"><div class="barra-relleno barra-objetivo-relleno"></div></div>
      </div>

      <div class="barra-bloque">
        <div class="barra-header"><span class="etiqueta">Colchón día</span><span class="texto-colchon-dia"></span></div>
        <div class="barra-fondo"><div class="barra-relleno barra-colchon-dia"></div></div>
      </div>

      <div class="barra-bloque">
        <div class="barra-header"><span class="etiqueta">Colchón total</span><span class="texto-colchon-total"></span></div>
        <div class="barra-fondo"><div class="barra-relleno barra-colchon-total"></div></div>
      </div>
    </div>
  </article>
</template>

<script src="assets/panel.js"></script>
</body>
</html>
